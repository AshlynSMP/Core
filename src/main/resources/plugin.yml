name: Core
version: '${project.version}'
main: nl.ashlyn.core.Core
description: Core plugin voor de AshlynSMP server.
api-version: '1.21'
authors: [ ntnt]
commands:
    ashlynplugins:
        description: Bekijk alle AshlynSMP plugins die geïnstalleerd zijn op de server.
        usage: /ashlynplugins
    corereload:
        description: Herlaad de config van Core en start de web API opnieuw.
        usage: /corereload
    act:
        description: Bekijk de huidige act of zet het verhaal verder.
        usage: /act [nummer] [titel] | /act info [nummer] <tekst> | /act uit|terug <speler>
    event:
        description: Bekijk of plan events, de website telt af en houdt een tijdlijn bij.
        usage: /event [list | set <dd-mm-yyyy> <hh:mm> <naam> | in <duur> <naam> | recap <tekst> | clear | remove <naam>]
    aanvragen:
        description: Bekijk en behandel whitelist-aanvragen van de website.
        usage: /aanvragen [accept | deny <naam>]
    wrapped:
        description: Beheer Ashlyn Wrapped, het seizoensoverzicht op de website.
        usage: /wrapped [export | reset confirm]
    aankomst:
        description: Regel de aankomst, het hok en het verspreiden over het bos.
        usage: /aankomst [aan | uit | hok | bos <straal> [afstand] | start | naam <speler> <naam> | papier <speler> | reset <speler>]
    onderhoud:
        description: Zet de server in onderhoud, dan kunnen alleen de leiders joinen.
        usage: /onderhoud [aan [reden] | uit]
